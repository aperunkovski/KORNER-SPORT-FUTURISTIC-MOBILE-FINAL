<!doctype html><html lang="mk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>КОРНЕР CMS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"></head><body><div id="login"><div class="login"><div class="cms-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-name">КОРНЕР</span></div><p>Мобилен редакциски панел</p><input id="email" type="email" value="admin@signal.mk" placeholder="Е-пошта"><input id="pass" type="password" value="signal123" placeholder="Лозинка"><button onclick="login()">НАЈАВИ СЕ</button><div id="err"></div></div></div><div id="app" hidden><header><div><b><i class="brand-mark" aria-hidden="true"></i><span class="brand-name">КОРНЕР</span></b><small>CMS / РЕДАКЦИЈА</small></div><button onclick="logout()">Одјави се</button></header><main><div id="stats" class="stats"></div><section><div class="title"><div><small>НОВА ОБЈАВА</small><h1 id="formTitle">Нова вест</h1></div><button onclick="resetForm()">+ Нова</button></div><form id="form" onsubmit="publish(event)"><input type="hidden" id="id"><label>Наслов<input id="title" required placeholder="Внеси наслов..."></label><label>Категорија<select id="category"></select></label><label>Краток опис<textarea id="excerpt" rows="3" placeholder="Краток опис за картичката..."></textarea></label><label>Текст<textarea id="content" rows="12" required placeholder="Напиши ја веста..."></textarea></label><label>Фотографија<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><input id="image" placeholder="или залепи URL до слика"></label><div id="imagePreview" class="image-preview"></div><div class="two"><label>Извор<input id="sourceName" placeholder="FFM, UEFA, ATP..."></label><label>Линк до извор<input id="sourceUrl" placeholder="https://..."></label></div><div class="actions"><button type="button" onclick="save('draft')">ЗАЧУВАЈ СКИЦА</button><button class="publish">ОБЈАВИ ВЕСТ</button></div><div id="msg"></div></form></section><section><div class="list-head"><div><small>СОДРЖИНА</small><h2>Сите вести</h2></div><span id="count"></span></div><div id="list"></div></section></main></div><script src="/admin/admin.js"></script></body></html>
